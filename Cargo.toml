[package]
name = "docsgpt-slack"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Slack bots for DocsGPT agents: streaming answers, agent sessions, files, multi-bot"
license = "MIT"
repository = "https://github.com/arc53/slack-bot-docsgpt-extenstion"

[dependencies]
docsgpt-bot = { git = "https://github.com/arc53/docsgpt-rs", rev = "0e623a5" }
axum = "0.8.9"
anyhow = "1.0.104"
thiserror = "2.0.20"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "http2", "charset"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
regex = "1.13.1"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
docsgpt-bot = { git = "https://github.com/arc53/docsgpt-rs", rev = "0e623a5", features = ["testing"] }
docsgpt = { git = "https://github.com/arc53/docsgpt-rs", rev = "0e623a5", features = ["mock"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
